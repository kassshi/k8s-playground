services:
  db:
    image: postgres:17
    restart: always
    ports:
      - 5432:5432
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
      POSTGRES_DB: ${DATABASE_NAME}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER} -d ${DATABASE_NAME}"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 10s
    volumes:
      - postgres-data:/var/lib/postgresql/data
  db-migrate:
    depends_on:
      db:
        condition: service_healthy
    image: migrate/migrate:4
    env_file: ./backend/.env
    command:
      - "-path=/migrations"
      - "-database=postgres://${DATABASE_USER}:${DATABASE_PASSWORD}@db:${DATABASE_PORT}/${DATABASE_NAME}?sslmode=disable"
      - "up"
    volumes:
      - ./backend/db/migrations:/migrations

  api:
    depends_on:
      - db
    build: backend/
    env_file:
      - ./backend/.env
    environment:
      DATABASE_HOST: db
    ports:
      - 8080:8080
  spa:
    depends_on:
      - api
    build: ./frontend/
    ports:
      - 3000:80
volumes:
  postgres-data:
