apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gateway-route-todo-api
  namespace: todo-api
spec:
  parentRefs:
    - name: envoy-gateway
      namespace: envoy-gateway
      sectionName: http
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: "/auth.v1.AuthService"
      backendRefs:
        - name: todo-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: "/user.v1.UserService"
      backendRefs:
        - name: todo-api
          port: 80
    - matches:
        - path:
            type: PathPrefix
            value: "/todo.v1.TodoService"
      backendRefs:
        - name: todo-api
          port: 80
