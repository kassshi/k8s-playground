releases:
  - name: envoy-gateway
    chart: oci://docker.io/envoyproxy/gateway-helm
    version: v1.7.3
    namespace: envoy-gateway-system
    createNamespace: true

  - name: prometheus
    chart: oci://ghcr.io/prometheus-community/charts/prometheus
    version: 29.6.0
    namespace: prometheus

  - name: grafana
    chart: oci://ghcr.io/grafana-community/helm-charts/grafana
    version: 12.4.0
    namespace: grafana
    values:
      - adminPassword: admin
